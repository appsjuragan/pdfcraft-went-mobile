[package]
name = "pdfcraft-mobile"
version = "0.13.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "pdfcraft_mobile"

[dependencies]
pdfcraft-cos = { path = "../../crates/cos" }
pdfcraft-create = { path = "../../crates/create" }
pdfcraft-edit = { path = "../../crates/edit" }
pdfcraft-sign = { path = "../../crates/sign" }
pdfcraft-render = { path = "../../crates/render" }
pdfcraft-engine = { path = "../../crates/engine" }
pdfcraft-automation = { path = "../../crates/automation", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
base64 = "0.22"

[patch.crates-io]
hayro-interpret = { path = "../../vendor/hayro-interpret" }
hayro = { path = "../../vendor/hayro" }
hayro-syntax = { path = "../../vendor/hayro-syntax" }
hayro-cmap = { path = "../../vendor/hayro-cmap" }
hayro-postscript = { path = "../../vendor/hayro-postscript" }
hayro-jbig2 = { path = "../../vendor/hayro-jbig2" }
lopdf = { path = "../../vendor/lopdf" }
winit = { path = "../../vendor/winit" }
egui-wgpu = { path = "../../vendor/egui-wgpu" }
vello_common = { path = "../../vendor/vello_common" }
